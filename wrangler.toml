# Cloudflare Workers & D1 Configuration for AutoShorts
name = "autoshorts"
main = "src/server/worker.ts"
compatibility_date = "2024-04-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare D1 Serverless SQLite Database Binding
[[d1_databases]]
binding = "DB"
database_name = "autoshorts-db"
database_id = "autoshorts-d1-database-id"

# Cloudflare Cron Triggers for Scheduled Public Profile Polling
[triggers]
crons = ["*/30 * * * *"] # Executes every 30 minutes

# Production Environment Variables (Public)
[vars]
NEXT_PUBLIC_APP_URL = "https://autoshorts.workers.dev"
STORAGE_DEFAULT_FOLDER = "Instagram Reels Backup"
POLLING_INTERVAL_MINUTES = "30"

# Note: Sensitive secrets (GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, TOKEN_ENCRYPTION_KEY)
# must be configured via `wrangler secret put <KEY>` and never committed to version control.
