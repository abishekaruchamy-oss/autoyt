# Cloudflare Workers & OpenNext Configuration for AutoShorts
name = "autoshorts"
main = "worker/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

# Static Assets served from OpenNext build output
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Cloudflare Cron Triggers for Scheduled Public Profile Polling (Runs every 30 minutes)
[triggers]
crons = ["*/30 * * * *"]

# Production Environment Variables (Public)
[vars]
NEXT_PUBLIC_APP_URL = "https://autoshorts.workers.dev"
STORAGE_DEFAULT_FOLDER = "Instagram Reels Backup"
POLLING_INTERVAL_MINUTES = "30"

# Cloudflare D1 Serverless Database Binding:
# To prevent deployment failure from placeholder IDs, bind after running:
#   npx wrangler d1 create autoshorts-db
# Then uncomment the block below and replace <INSERT_D1_UUID_HERE> with the actual UUID:
# [[d1_databases]]
# binding = "DB"
# database_name = "autoshorts-db"
# database_id = "<INSERT_D1_UUID_HERE>"

# Note: Sensitive secrets (GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, TOKEN_ENCRYPTION_KEY)
# must be configured via `npx wrangler secret put <KEY>` and never committed to version control.
